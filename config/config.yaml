project:
  name: pdbbind-representation-alignment
  created: '2026-09-19'
paths:
  lp_pdbbind_csv: /content/drive/MyDrive/pdbbind_data/inputs/LP_PDBBind.csv
  pdbbind_dir: /content/drive/MyDrive/pdbbind_data/PDBbind_2020
  gnina_train_id_files: []
split:
  source: LP-PDBBind
  pdbbind_release: '2020'
  split_column: split
  affinity_column: value
  train_clean_level: CL1
  eval_clean_level: CL2
  exclude_covalent: true
  rederive_clusters: false
  published_thresholds:
    protein_seq_identity: 0.5
    ligand_dice_morgan1024: 0.99
  analysis_split: test
  file: data/splits/split_v1.tsv
  n_by_split:
    train: 7393
    test: 2171
    val: 958
training:
  regime: all_retrained_on_LP_train
  seed: 20260919
  hyperparam_selection: fixed_in_advance_early_stop_on_val_loss_only
  egnn:
    hidden: 64
    n_layers: 3
    optimizer: adam
    lr: 0.0003
    batch_size: 32
    max_epochs: 300
    early_stopping_patience: 20
    early_stopping_metric: val_loss
  distance_gnn:
    hidden: 64
    n_layers: 3
    n_rbf: 16
    cutoff_A: 5.0
    optimizer: adam
    lr: 0.0003
    batch_size: 32
    max_epochs: 300
    early_stopping_patience: 20
    early_stopping_metric: val_loss
  gnina:
    note: Default2018Affinity, random init, trained on LP-PDBBind train under training.regime
    init: random_Default2018Affinity
    optimizer: adam
    lr: 0.0001
    batch_size: 16
    max_epochs: 200
    early_stopping_patience: 20
    early_stopping_metric: val_loss
    augmentation: random_rotation+translation_2A
    loss: affinity_only
covariates:
  core:
  - complex_atom_count
  - ligand_heavy_atom_count
  extra: []
  complex_atom_count_definition: pocket_file_heavy+ligand_heavy
  atom_counting: heavy_only
  standardize: true
  vif_flag_threshold: 10
protonation:
  tool: pdb2pqr
  ph: 7.4
  applied: once_upstream_reused_everywhere
preprocessing:
  cka: mean_center_only
  transfer: zscore_per_dim
procrustes:
  dim_reduction: pca_to_min_dim
embeddings:
  dtype: float64
  extraction:
    mode: eval
    batch_size: 1
    shuffle: false
  models:
    egnn:
      layer: readout.0
      dim: 64
    distance_gnn:
      layer: readout.0
      dim: 64
    gnina:
      cnn: crossdock_default2018
      layer: pose.pose_output
      dim: 27648
      orientation: fixed_canonical
      n_rotations: 1
      grid_resolution_A: 0.5
      grid_dimension_A: 23.5
      fallback_order:
      - pafnucy
      - transformer_scorer
      - vina_only_arm
      fallback: none_needed
controls:
  untrained_anchor: true
  same_arch_seed_anchor: true
  anchor_seed: 20260923
cka:
  estimator: debiased_u_statistic
  kernel: linear
  n_perm: 10000
  n_boot: 10000
  ci_level: 0.95
  ci_method: percentile
  alpha: 0.05
  correction: holm
  primary_null: identity_permutation
  pairs:
  - - egnn
    - gnina
  - - egnn
    - distance_gnn
  - - gnina
    - distance_gnn
transfer:
  pca_k: 64
  pca_k_rule: min(64, min embedding dim across the three models)
  ridge_alpha_grid:
  - 0.001
  - 0.01
  - 0.1
  - 1
  - 10
  - 100
  - 1000
  inner_cv_folds: 5
  a2b_symmetric: false
  n_boot: 10000
  ci_method: percentile
  per_stratum_min_n: 20
diagnostics:
  mutual_knn:
    enabled: true
    k: 10
    status: diagnostic_not_confirmatory
  leakage_scaffold_check:
    enabled: true
    fingerprint: morgan_r2_1024
    similarity_threshold_flag: 0.95
    status: exploratory_sanity_check
analysis_rules:
  n_stratified_min: 150
  exclusion_flag_fraction: 0.1
  imbalance_ratio_for_rank_biserial: 4
  h1_convergent_cut: 0.5
  h1_robust_rule: cluster_bootstrap_lower_bound_of_nAB_gt_0
  h1_nAB_min_denominator: 0.05
  h2_status: descriptive
  h2_test_r2_gate: 0.1
  h3a_primary: spearman_partial_on_ligand_heavy_atom_count
  h3a_secondary: spearman_raw
  h3a_holm_family: 3_models_own_family
  core_set: all_models_both_seeds_embedded_and_crystal_pose_ok
  h3_set: core_and_vina_prepared_and_docked
  cluster_mmseqs:
    min_seq_id: 0.3
    coverage: 0.8
  structural_panel_exploratory:
  - contact_count
  - pocket_volume
  - ligand_buried_fraction
  - pocket_polar_fraction
vina:
  package_version: 1.2.7
  prep_protocol: meeko_adfr
  cpu: 1
  exhaustiveness: 8
  n_poses: 20
  top1_only: true
  box_definition: ligand_centered_from_crystal_pose_plus_fixed_padding
  box_padding_A: 8.0
  pose_success_rmsd_A: 2.0
seeds:
  global: 20260919
  numpy: 20260919
  torch: 20260919
  vina: 20260919
  bootstrap: 20260920
  permutation: 20260921
  anchor: 20260923
  vina_reseed: 20260922
reproducibility:
  requirements_frozen_at_lock: true
